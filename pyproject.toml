[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-tool"
version = "1.0.0"
description = "State-of-the-Art LLM-Powered Annotation & BERT Training Pipeline for Multilingual Text Classification"
readme = "README.md"
authors = [
    {name = "Antoine Lemor"},
]
license = "MIT"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Text Processing :: General",
    "Environment :: Console",
    "Natural Language :: English",
    "Natural Language :: French",
    "Natural Language :: Spanish",
    "Natural Language :: German",
    "Natural Language :: Chinese (Simplified)",
    "Natural Language :: Arabic",
    "Framework :: Jupyter",
]
keywords = [
    "llm",
    "annotation",
    "machine-learning",
    "natural-language-processing",
    "transformers",
    "bert",
    "gpt",
    "training",
    "benchmarking",
    "multilingual",
    "ai",
    "deep-learning",
    "data-annotation",
    "model-training",
    "deberta",
    "roberta",
    "electra",
    "albert",
    "xlm-roberta",
    "camembert",
    "longformer",
    "openai",
    "claude",
    "anthropic",
    "gemini",
    "ollama",
    "local-llm",
    "text-classification",
    "sequence-classification",
    "multi-label-classification",
    "social-science",
    "research-tool",
    "annotation-tool",
    "language-detection",
    "multilingual-nlp",
    "pytorch",
    "huggingface",
    "transformer-models",
    "pipeline",
    "cli-tool",
    "interactive-cli",
    "model-benchmarking",
    "prompt-engineering",
]
# Every dependency below ships a prebuilt wheel for Windows, macOS (Intel and
# Apple Silicon) and Linux on CPython 3.11-3.13. Nothing here needs a C, C++ or
# Rust toolchain, so `pip install .` never falls back to a source build.
# Anything that would is in an opt-in extra at the bottom of this section.
dependencies = [
    # Data manipulation
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "openpyxl>=3.1.0",
    "pyarrow>=18.1.0",
    "pyreadr>=0.5.0",
    # Database
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    # JSON and data validation
    "pydantic>=2.0.0",
    "jsonschema>=4.0.0",
    # CLI and interface
    "rich>=14.0.0",
    "tqdm>=4.65.0",
    "psutil>=5.9.0",
    # Charts. Imported unconditionally by the annotation and training displays,
    # so this is a core requirement rather than an optional one.
    "matplotlib>=3.8.0",
    # Language detection. 2.1.1 is the floor because it is the first release
    # with a Windows wheel for every supported CPython.
    "lingua-language-detector>=2.1.1",
    # Logging
    "loguru>=0.7.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "click>=8.0.0",
    "requests>=2.28.0",
    "pyyaml>=6.0.0",
    "python-dateutil>=2.8.0",
    "cryptography>=41.0.0",
    "tabulate>=0.9.0",
    # LLM and AI
    "openai>=1.0.0",
    "ollama>=0.6.0",
    "transformers>=4.35.0",
    "torch>=2.0.0",
    "accelerate>=1.0.0",
    "sentencepiece>=0.2.0",
    "protobuf>=3.20.0",
    "safetensors>=0.6.0",
    "tokenizers>=0.20.0",
    # Training
    "peft>=0.11.0",
    "datasets>=4.0.0",
    "evaluate>=0.4.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.14.0",
    "nltk>=3.8.0",
    "sacremoses>=0.1.0",
]

[project.optional-dependencies]

# Cloud LLM providers other than OpenAI. Pure-Python, installs everywhere.
providers = [
    "anthropic>=0.18.0",
    "google-generativeai>=0.3.0",
]

# The `--api` mode's HTTP server.
api = [
    "fastapi>=0.103.0",
    "uvicorn>=0.23.0",
]

# Second-opinion language detector used when lingua is unsure.
langdetect = [
    "langdetect>=1.0.9",
]

# Experiment tracking. Not imported directly; these are the backends
# transformers' Trainer picks up through `report_to` once they are present.
mlops = [
    "tensorboard>=2.13.0",
    "mlflow>=2.8.0",
    "wandb>=0.15.0",
    "optuna>=3.3.0",
]

# Audio/video transcription (llm_tool.transcription). Heavy and rarely needed,
# so it stays out of `all`. Also needs the ffmpeg binary on PATH
# (`winget install Gyan.FFmpeg`, `brew install ffmpeg`, `apt install ffmpeg`).
transcription = [
    "openai-whisper>=20231117",
    "yt-dlp>=2024.1.0",
]

# --- Extras that need a compiler ------------------------------------------
# Deliberately excluded from `all`: neither publishes a wheel for every
# platform/CPython combination we support, so `pip install ".[all]"` would try
# to build C++ from source and fail on a machine without MSVC or Xcode.
# Both back optional features that have a wheel-only alternative:
#   llamacpp -> use Ollama instead
#   fasttext -> lingua (a core dependency) is the default detector

# GGUF inference through llama.cpp. Needs CMake and a C++ toolchain on every
# platform: the project ships no wheels at all.
llamacpp = [
    "llama-cpp-python>=0.2.0",
]

# fastText language identification. No Windows wheel exists for CPython 3.11+,
# so this needs the Visual Studio C++ build tools there.
fasttext = [
    "fasttext-wheel>=0.9.2; python_version < '3.13'",
    "fasttext>=0.9.2; python_version >= '3.13'",
]

dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.7.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
    "isort>=5.12.0",
    "pre-commit>=3.3.0",
    "ipykernel>=6.25.0",
    "jupyter>=1.0.0",
    "notebook>=7.0.0",
]

# The recommended install. Everything the code can actually use, and nothing
# that needs a compiler -- so it resolves from wheels alone on Windows, macOS
# and Linux. Listed out rather than referenced as llm-tool[...] so that the
# resolution never depends on self-referential extras working.
all = [
    # providers
    "anthropic>=0.18.0",
    "google-generativeai>=0.3.0",
    # api
    "fastapi>=0.103.0",
    "uvicorn>=0.23.0",
    # langdetect
    "langdetect>=1.0.9",
    # mlops
    "tensorboard>=2.13.0",
    "mlflow>=2.8.0",
    "wandb>=0.15.0",
    "optuna>=3.3.0",
]

# Kept as an alias so `pip install "llm-tool[advanced]"` from older docs and
# scripts keeps working; `all` is the name to use.
advanced = [
    "anthropic>=0.18.0",
    "google-generativeai>=0.3.0",
    "fastapi>=0.103.0",
    "uvicorn>=0.23.0",
    "langdetect>=1.0.9",
    "tensorboard>=2.13.0",
    "mlflow>=2.8.0",
    "wandb>=0.15.0",
    "optuna>=3.3.0",
]

[project.scripts]
llm-tool = "llm_tool.__main__:main"
llmtool = "llm_tool.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["llm_tool*"]
# Excluded so the macOS "Finder duplicate" files (module names containing a
# space, e.g. "task_scheduler 2.py") can never be shipped in a wheel.
exclude = ["llm_tool.*.__pycache__", "tests*"]

[tool.setuptools.package-data]
# The package ships no bundled data today: prompts/, data/ and configs/ live at
# the project root and belong to the user, not to the distribution. Declared
# anyway so that adding a file under one of these names starts working without
# anyone having to remember this file.
llm_tool = [
    "data/*.json",
    "data/*.jsonl",
    "prompts/*.txt",
    "prompts/*.json",
    "configs/*.yaml",
    "configs/*.json",
]

[tool.black]
line-length = 100
target-version = ['py311', 'py312', 'py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]
